version: "3.9"

services:
  backend:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - sqlite_data:/app/db
    env_file:
      - .env
    command: >
      sh -c "python manage.py migrate &&
             python manage.py load_fixtures &&
             python manage.py runserver 0.0.0.0:8000"

volumes:
  sqlite_data: